<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olivier Nguyen</title>
  <link rel="icon" type="image/jpeg" href="vignette_1.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ef;
      --ink: #111010;
      --muted: #5a5753;
      --rule: #d8d4cd;
      --link-hover-bg: #111010;
      --link-hover-fg: #f5f3ef;
    }

    body.dark {
      --bg: #111010;
      --ink: #f0ede8;
      --muted: #666260;
      --rule: #2a2826;
      --link-hover-bg: #f0ede8;
      --link-hover-fg: #111010;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 4rem 6rem;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      display: grid;
      grid-template-columns: var(--col-w, 480px) var(--col-w, 480px);
      justify-content: center;
      gap: 9rem;
      align-items: stretch;
    }

    .left { min-width: 0; width: 100%; }

    .portrait {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 2px;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 72% center;
      display: block;
      filter: grayscale(8%) contrast(1.02);
      transition: filter 0.4s ease;
    }

    body.dark .portrait img {
      filter: grayscale(15%) contrast(0.98) brightness(0.92);
    }
    .portrait img.dimmed {
      filter: grayscale(40%) brightness(0.5) contrast(0.9);
    }

    .header {
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 9.5vw, 7.2rem);
      line-height: 0.7;
      letter-spacing: -0.01em;
      color: var(--ink);
      transition: color 0.4s ease;
    }

    .tagline {
      margin-top: 3rem;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.4s ease;
      display: block;
      text-align: justify;
      text-align-last: justify;
    }
    .tagline::after {
      content: '';
      display: inline-block;
      width: 100%;
    }

    .mobile-break { display: none; }

    .section {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      opacity: 0;
      transform: translateY(10px);
    }

    .section:nth-child(1) { animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.45s forwards; }
    .section:nth-child(2) { animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.6s forwards; }
    .section:nth-child(3) { animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.75s forwards; }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.4s ease;
    }

    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .links a {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 400;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .links a:hover {
      color: var(--ink);
    }

    .articles {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding-left: 0.9rem;
      max-width: 480px;
    }

    .articles li {
      display: flex;
      gap: 0.45rem;
      align-items: flex-start;
    }

    .articles .bullet {
      color: var(--rule);
      font-size: 0.9rem;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .articles a {
      font-size: 0.78rem;
      font-weight: 400;
      text-decoration: none;
      color: var(--muted);
      line-height: 1.4;
      transition: color 0.2s ease;
    }

    .articles a:hover {
      color: var(--ink);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    #preview-bubble {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      width: 300px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      opacity: 0;
      transform: scale(0.96) translateY(8px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    #preview-bubble.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    #preview-bubble img {
      width: 100%;
      display: block;
      transition: opacity 0.2s ease;
    }

    @media (max-width: 820px) {
      .container {
        grid-template-columns: minmax(0, 1fr);
        gap: 2.5rem;
        max-width: 820px;
      }
      .portrait { display: none; }
    }

    @media (max-width: 640px) {
      body {
        justify-content: flex-start;
        padding: 0 1.5rem 3rem;
      }

      .container {
        display: flex;
        flex-direction: column;
      }

      .header {
        height: 50vh;
        margin-bottom: 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      h1 {
        font-size: clamp(4.5rem, 20vw, 7rem);
        line-height: 0.85;
      }

      .tagline {
        margin-top: 2rem;
        text-align: left;
        text-align-last: left;
        width: auto !important;
      }

      .mobile-break { display: inline; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="left">

    <div class="header">
      <h1>Olivier<br><span id="lastname">Nguyen</span></h1>
      <p class="tagline">Product Manager &amp;<br class="mobile-break"> Tech Enthusiast</p>
    </div>

    <div class="content">

      <div class="section">
        <span class="section-label">Profiles</span>
        <ul class="links">
          <li><a href="https://www.linkedin.com/in/olivier-nguyen-innov" target="_blank" rel="noopener" data-preview="linkedin_screenshot.jpeg">LinkedIn</a></li>
          <li>
            <a href="https://medium.com/@olivier.nguyen" target="_blank" rel="noopener" data-preview="medium_screenshot.jpeg">Medium</a>
            <ul class="articles">
              <li><span class="bullet">╰</span><a href="https://medium.com/@olivier.nguyen/comment-transformer-100k-clients-dun-e-commerce-en-3-personas-572fdec60b73" target="_blank" rel="noopener" data-preview="medium_screenshot.jpeg">Comment transformer 100k clients<br>d'un e-commerce en 3 personas ?</a></li>
            </ul>
          </li>
        </ul>
      </div>

      <div class="section">
        <span class="section-label">Website Upgrade</span>
        <ul class="links">
          <li><a href="upway/">Upway upgrade (e-bike shop)</a></li>
        </ul>
      </div>

      <div class="section">
        <span class="section-label">Website Created</span>
        <ul class="links">
          <li><a href="bluesuburbhour/">Rock band portfolio (3D website)</a></li>
        </ul>
      </div>

    </div>

    </div>

    <div class="portrait">
      <img src="photo_3.jpeg" alt="Portrait d'Olivier Nguyen en randonnée">
    </div>

  </div>

  <div id="preview-bubble"><img alt=""></div>

  <script>
    function matchTaglineWidth() {
      const lastname = document.getElementById('lastname');
      const tagline = document.querySelector('.tagline');
      if (!lastname || !tagline) return;
      const w = lastname.getBoundingClientRect().width;
      tagline.style.width = w + 'px';
    }

    function matchColumnWidth() {
      const container = document.querySelector('.container');
      if (!container) return;
      const prev = container.style.getPropertyValue('--col-w');
      container.style.setProperty('--col-w', 'max-content');
      let max = 0;
      document.querySelectorAll('.links > li > a').forEach(a => {
        const w = a.getBoundingClientRect().width;
        if (w > max) max = w;
      });
      const h1 = document.querySelector('h1');
      if (h1) {
        for (const r of h1.getClientRects()) {
          if (r.width > max) max = r.width;
        }
      }
      if (prev) container.style.setProperty('--col-w', prev);
      if (max > 0) container.style.setProperty('--col-w', Math.ceil(max) + 'px');
    }

    function refresh() {
      matchTaglineWidth();
      matchColumnWidth();
    }

    document.fonts.ready.then(refresh);
    window.addEventListener('resize', refresh);
    refresh();

    const bubble = document.getElementById('preview-bubble');
    const bubbleImg = bubble.querySelector('img');
    let hideTimeout;
    document.querySelectorAll('a[data-preview]').forEach(link => {
      link.addEventListener('mouseenter', () => {
        clearTimeout(hideTimeout);
        const src = link.dataset.preview;
        const portrait = document.querySelector('.portrait');
        const rect = portrait.getBoundingClientRect();
        bubble.style.left = (rect.left + (rect.width - 300) / 2) + 'px';
        bubble.style.top  = (rect.top + rect.height * 0.15) + 'px';
        portrait.querySelector('img').classList.add('dimmed');
        if (bubble.classList.contains('visible')) {
          if (bubbleImg.getAttribute('src') !== src) {
            bubbleImg.style.opacity = '0';
            setTimeout(() => {
              bubbleImg.src = src;
              bubbleImg.style.opacity = '1';
            }, 200);
          }
        } else {
          bubbleImg.src = src;
          bubble.classList.add('visible');
        }
      });
      link.addEventListener('mouseleave', () => {
        hideTimeout = setTimeout(() => {
          bubble.classList.remove('visible');
          document.querySelector('.portrait img').classList.remove('dimmed');
        }, 50);
      });
    });
  </script>
</body>
</html>
