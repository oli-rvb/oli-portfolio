<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bernard Lhermitte</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ef;
      --ink: #111010;
      --muted: #5a5753;
      --rule: #d8d4cd;
      --link-hover-bg: #111010;
      --link-hover-fg: #f5f3ef;
    }

    body.dark {
      --bg: #111010;
      --ink: #f0ede8;
      --muted: #666260;
      --rule: #2a2826;
      --link-hover-bg: #f0ede8;
      --link-hover-fg: #111010;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 4rem 2rem;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    .header {
      margin-bottom: 3.5rem;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 9.5vw, 7.2rem);
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--ink);
      transition: color 0.4s ease;
    }

    .tagline {
      margin-top: 0.9rem;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.4s ease;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      opacity: 0;
      transform: translateY(10px);
    }

    .section:nth-child(1) { animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.45s forwards; }
    .section:nth-child(2) { animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.6s forwards; }
    .section:nth-child(3) { animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.75s forwards; }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.4s ease;
    }

    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .links a {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 400;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .links a:hover {
      color: var(--ink);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>Bernard<br>Lhermitte</h1>
      <p class="tagline">Product Manager &amp; Tech Enthusiast</p>
    </div>

    <div class="content">

      <div class="section">
        <span class="section-label">Profiles</span>
        <ul class="links">
          <li><a href="www.linkedin.com/in/olivier-nguyen-innov" target="_blank" rel="noopener">LinkedIn</a></li>
          <li><a href="https://medium.com/@olivier.nguyen" target="_blank" rel="noopener">Medium</a></li>
        </ul>
      </div>

      <div class="section">
        <span class="section-label">Website Upgrade</span>
        <ul class="links">
          <li><a href="upway/">Upway Upgrade</a></li>
        </ul>
      </div>

      <div class="section">
        <span class="section-label">Website Created</span>
        <ul class="links">
          <li><a href="bluesuburbhour/">My Rock Band 3D Website</a></li>
        </ul>
      </div>

    </div>

  </div>
</body>
</html>
